id: KMS-KX-001
version: 1
title: KMS asymmetric encryption key uses RSA or SM2, whose ciphertexts can be decrypted later
resource_types: [aws_kms_key]
category: key-exchange
severity: medium
applies_when:
  attr: key_usage
  eq: ENCRYPT_DECRYPT
unknown_when:
  any:
    - not:
        attr: customer_master_key_spec
        in: [SYMMETRIC_DEFAULT, RSA_2048, RSA_3072, RSA_4096, ECC_NIST_P256, ECC_NIST_P384, ECC_NIST_P521, ECC_NIST_EDWARDS25519, ECC_SECG_P256K1, SM2, HMAC_224, HMAC_256, HMAC_384, HMAC_512, ML_DSA_44, ML_DSA_65, ML_DSA_87]
    - not:
        attr: key_usage
        in: [ENCRYPT_DECRYPT, SIGN_VERIFY, GENERATE_VERIFY_MAC, KEY_AGREEMENT]
    - all:
        - attr: customer_master_key_spec
          matches: "^(ECC_|ML_DSA_|HMAC_)"
        - attr: key_usage
          eq: ENCRYPT_DECRYPT
pass_when:
  attr: customer_master_key_spec
  eq: SYMMETRIC_DEFAULT
defaults:
  key_usage: ENCRYPT_DECRYPT
  customer_master_key_spec: SYMMETRIC_DEFAULT
fix:
  kind: guidance
  safety: none
  note: "KMS has no post-quantum key spec for public-key encryption. Data that must stay confidential beyond the arrival of a cryptographically relevant quantum computer belongs under a symmetric KMS key (AES-256-GCM) with envelope encryption, where the public-key step is removed. A key spec cannot be changed; this means a new key and a re-encryption of ciphertexts that matter."
message:
  fail: "{address} is a public-key encryption key ({customer_master_key_spec}) used for ENCRYPT_DECRYPT. Anything encrypted to its public key is recoverable once that algorithm is broken, so long-lived ciphertexts are the harvest-now-decrypt-later exposure here."
  pass: "{address} encrypts with {customer_master_key_spec}, a symmetric key. AWS's words: a large-scale quantum attack on 256-bit AES-GCM ciphertexts reduces the effective security of the key to 128 bits, which is sufficient to make brute force attacks infeasible. (In China Regions SYMMETRIC_DEFAULT is 128-bit SM4; the same AWS page says so and offers no quantum statement for it.)"
  unknown: "{address}: key_usage is {key_usage} and customer_master_key_spec is {customer_master_key_spec}. Either one is not a literal value, or it is not a value the KMS API accepts (the provider would reject it at plan time); check the spelling."
sources:
  - url: https://docs.aws.amazon.com/kms/latest/developerguide/symm-asymm-choose-key-spec.html
    verified: 2026-10-10
    quote: "RSA key specs (encryption and decryption -or- signing and verification): RSA_2048, RSA_3072, RSA_4096. ML-DSA key specs: ML_DSA_44, ML_DSA_65, ML_DSA_87."
    paraphrase: true
  - url: https://docs.aws.amazon.com/kms/latest/developerguide/symm-asymm-choose-key-spec.html
    verified: 2026-10-10
    quote: "Theoretical future, large-scale quantum computing attacks on ciphertexts created under 256-bit AES-GCM keys reduce the effective security of the key to 128 bits. But, this security level is sufficient to make brute force attacks on AWS KMS ciphertexts infeasible. The only exception in China Regions, where SYMMETRIC_DEFAULT represents a 128-bit symmetric key that uses SM4 encryption."
  - url: https://docs.aws.amazon.com/kms/latest/developerguide/pqtls.html
    verified: 2026-10-10
    quote: "Otherwise, an adversary may be able to capture data encrypted with classic cipher suites today and decrypt it once quantum computers become available. This strategy is known as harvest now, decrypt later."
  - url: https://raw.githubusercontent.com/hashicorp/terraform-provider-aws/main/website/docs/r/kms_key.html.markdown
    verified: 2026-10-10
    quote: "customer_master_key_spec ... Defaults to SYMMETRIC_DEFAULT. key_usage ... Defaults to ENCRYPT_DECRYPT."
