id: PCA-SIG-001
version: 1
title: Private CA signs with a classical algorithm
resource_types: [aws_acmpca_certificate_authority]
category: signature
severity: low
unknown_when:
  not:
    attr: certificate_authority_configuration.key_algorithm
    in: [RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1, ML_DSA_44, ML_DSA_65, ML_DSA_87, SM2]
pass_when:
  attr: certificate_authority_configuration.key_algorithm
  in: [ML_DSA_44, ML_DSA_65, ML_DSA_87]
fix:
  kind: guidance
  safety: none
  note: "AWS Private CA can create CAs, issue certificates, publish CRLs and run OCSP with ML_DSA_44, ML_DSA_65 or ML_DSA_87 (since 10 November 2025). A CA's key algorithm is fixed at creation, so this means a new hierarchy. ML-DSA certificates are for relying parties that verify ML-DSA, such as code signing and device identity; ACM accepts only RSA and ECDSA certificates, so load balancers, CloudFront and API Gateway cannot serve an ML-DSA certificate today. Do not replace a TLS-serving CA on the strength of this finding."
message:
  fail: "{address} is a private CA with key algorithm {certificate_authority_configuration.key_algorithm}. Its certificates are classical signatures; whether that matters depends on how long they must stay trustworthy and on whether the relying parties could verify ML-DSA at all."
  pass: "{address} is an ML-DSA private CA ({certificate_authority_configuration.key_algorithm}). Relying parties must verify ML-DSA; ACM-integrated TLS services cannot use its certificates."
  unknown: "{address}: key_algorithm is {certificate_authority_configuration.key_algorithm}. Either it is not a literal value, or it is not a value the Private CA API accepts; check the spelling."
sources:
  - url: https://docs.aws.amazon.com/privateca/latest/APIReference/API_CertificateAuthorityConfiguration.html
    verified: 2026-10-10
    quote: "KeyAlgorithm Valid Values: RSA_2048 | RSA_3072 | RSA_4096 | EC_prime256v1 | EC_secp384r1 | EC_secp521r1 | ML_DSA_44 | ML_DSA_65 | ML_DSA_87 | SM2. SigningAlgorithm Valid Values: SHA256WITHECDSA | SHA384WITHECDSA | SHA512WITHECDSA | SHA256WITHRSA | SHA384WITHRSA | SHA512WITHRSA | SM3WITHSM2 | ML_DSA_44 | ML_DSA_65 | ML_DSA_87"
  - url: https://aws.amazon.com/about-aws/whats-new/2025/11/aws-private-ca-post-quantum-digital-certificates/
    verified: 2026-10-10
    quote: "You can create CAs, issue certificates, create certificate revocation lists (CRLs) and configure online certificate status protocol (OCSP) responders using ML-DSA. ... you can now test ML-DSA in your environment for certificate issuance, identity verification, and code signing. Posted on: Nov 10, 2025."
  - url: https://docs.aws.amazon.com/acm/latest/userguide/acm-certificate-characteristics.html
    verified: 2026-10-10
    quote: "ACM supports these RSA and ECDSA public key algorithms: RSA 1024 bit (RSA_1024), RSA 2048 bit (RSA_2048), RSA 3072 bit (RSA_3072), RSA 4096 bit (RSA_4096), ECDSA 256 bit (EC_prime256v1), ECDSA 384 bit (EC_secp384r1), ECDSA 521 bit (EC_secp521r1)."
